apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

def packageJson = new groovy.json.JsonSlurper().parse(file('../../package.json'))
def packageVersionName = packageJson.version ?: "1.0.0"
def packageVersionCode = packageVersionName.tokenize('.').last().isInteger() ? packageVersionName.tokenize('.').last().toInteger() : 1
def ciVersionName = System.getenv("APP_VERSION")
def resolvedVersionName = ciVersionName ?: packageVersionName
def resolvedVersionCode = (ciVersionName != null && ciVersionName.tokenize('.').last().isInteger()) ? ciVersionName.tokenize('.').last().toInteger() : packageVersionCode

android {
    namespace 'com.mijornada.app'
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.mijornada.app"
        minSdk 26
        targetSdk rootProject.ext.targetSdkVersion
        versionCode resolvedVersionCode
        versionName resolvedVersionName
        vectorDrawables {
            useSupportLibrary true
        }
    }

    signingConfigs {
        debug {
            storeFile file('../app/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.8'
    }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    implementation "androidx.core:core-ktx:1.12.0"
    implementation "androidx.percentlayout:percentlayout:1.0.0"
    implementation "androidx.legacy:legacy-support-v4:1.0.0"
    implementation "androidx.recyclerview:recyclerview:1.3.2"

    // Wear OS Compose
    implementation 'androidx.wear.compose:compose-material:1.3.0'
    implementation 'androidx.wear.compose:compose-foundation:1.3.0'
    implementation 'androidx.wear.compose:compose-navigation:1.3.0'

    // Google Play Services Wearable
    implementation 'com.google.android.gms:play-services-wearable:18.1.0'
    implementation 'androidx.wear:wear:1.3.0'
    // Teclado / voz del sistema (RemoteInput) para entrada de notas
    implementation 'androidx.wear:wear-input:1.1.0'

    // Tile (cuadricula) y complicacion de esfera del turno
    // Versiones compatibles con compileSdk 34 (tiles 1.6/protolayout 1.4 exigen SDK 35+)
    implementation 'androidx.wear.tiles:tiles:1.3.0'
    implementation 'androidx.wear.protolayout:protolayout:1.1.0'
    implementation 'androidx.wear.protolayout:protolayout-expression:1.1.0'
    implementation 'androidx.wear.watchface:watchface-complications-data-source-ktx:1.2.1'
    implementation 'androidx.concurrent:concurrent-futures:1.1.0'

    // Jetpack Compose Básico
    implementation 'androidx.activity:activity-compose:1.8.2'
    implementation 'androidx.fragment:fragment-ktx:1.6.2'
    implementation 'androidx.compose.ui:ui:1.6.1'
    implementation 'androidx.compose.ui:ui-tooling-preview:1.6.1'
    debugImplementation 'androidx.compose.ui:ui-tooling:1.6.1'

    // Optimizador de carga
    implementation 'androidx.profileinstaller:profileinstaller:1.3.1'

    // WorkManager para reintentos de outbox
    implementation 'androidx.work:work-runtime-ktx:2.9.0'
}
